<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skycast — Weather Forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app" id="app">

        <header class="topbar">
            <h1 class="logo"><span>Sky</span>cast</h1>
            <button class="unit-toggle" id="unitToggle" title="Switch units">°C</button>
        </header>

        <form class="search-bar" id="searchForm" autocomplete="off">
            <input type="text" id="cityInput" placeholder="Search for a city..." required>
            <button type="submit" title="Search">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/></svg>
            </button>
            <button type="button" id="geoBtn" title="Use my location">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 8a4 4 0 1 0 4 4 4 4 0 0 0-4-4m8.94 3a9 9 0 0 0-8-8V1h-2v2a9 9 0 0 0-8 8H1v2h2a9 9 0 0 0 8 8v2h2v-2a9 9 0 0 0 8-8h2v-2ZM12 19a7 7 0 1 1 7-7 7 7 0 0 1-7 7"/></svg>
            </button>
        </form>

        <div class="chips" id="recentChips"></div>

        <div class="status" id="status" hidden></div>

        <main class="content" id="content" hidden>

            <section class="current-card">
                <div class="current-main">
                    <div>
                        <h2 class="city-name" id="cityName">—</h2>
                        <p class="date-time" id="dateTime">—</p>
                    </div>
                    <div class="icon-temp">
                        <span class="weather-icon" id="weatherIcon">☀️</span>
                        <span class="temp" id="temp">—°</span>
                    </div>
                </div>
                <p class="description" id="description">—</p>
                <p class="feels-like">Feels like <span id="feelsLike">—°</span></p>

                <div class="details-grid">
                    <div class="detail">
                        <span class="detail-label">Humidity</span>
                        <span class="detail-value" id="humidity">—%</span>
                    </div>
                    <div class="detail">
                        <span class="detail-label">Wind</span>
                        <span class="detail-value" id="wind">— km/h</span>
                    </div>
                    <div class="detail">
                        <span class="detail-label">Pressure</span>
                        <span class="detail-value" id="pressure">— hPa</span>
                    </div>
                    <div class="detail">
                        <span class="detail-label">Rain chance</span>
                        <span class="detail-value" id="rainChance">—%</span>
                    </div>
                </div>
            </section>

            <section class="forecast">
                <h3>6-Day Forecast</h3>
                <div class="forecast-list" id="forecastList"></div>
            </section>

        </main>

        <div class="empty-state" id="emptyState">
            <span>🌤️</span>
            <p>Search a city or use your current location to see the forecast.</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
